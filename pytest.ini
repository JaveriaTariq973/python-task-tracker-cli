[pytest]
# --- where to find code and tests
pythonpath = .
testpaths = tests

# --- default options: show reason for skipped/failed/xfail in the summary
addopts = -ra

# --- test groups (use with:  pytest -m <group>)
markers =
    services: GROUP module - tests for app/task_services.py
    storage: GROUP module - tests for app/storage.py
    cli: GROUP module - tests for app/cli.py
    utils: GROUP module - tests for app/utils.py
    smoke: GROUP type - quick happy-path checks
    negative: GROUP type - invalid input / error handling checks
    boundary: GROUP type - boundary value analysis checks
    csv_data: GROUP type - data-driven tests reading from test_data/*.csv
